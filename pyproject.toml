readme = "README.md"
authors = [
    { name = "KJLavender", email = "KJLavender@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "lifelines>=0.30.0",
    "lightgbm>=4.7.0",
