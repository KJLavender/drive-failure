# 成本模型（相對單位：主動換一顆碟 = 1）
replace_cost: 1.0        # 主動換碟：硬碟 + 人力
failure_cost: 5.0        # 非計畫故障：降級運轉期間的重建、緊急處理、資料風險
watch_cost: 0.05         # 觀察：預備備品、每日檢查
watch_mitigation: 0.5    # 觀察時若真的故障，能省下的故障成本比例（備品已就位、換得快）
risk_logit_sigma: 0.5    # 模型層信心：風險估計在 logit 上 ±sigma 的誤差下，動作是否改變
min_stakes: 0.02         # 最佳與次佳動作的期望成本差 < 此值 → 選錯也沒差，直接決定，不打擾 LLM／人工
